name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
    # 1. Source Code & Version Control
    - name: Checkout Code
      uses: actions/checkout@v4

        # 2. Continuous Integration (CI)
        - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Explicitly install pytest in the runner environment environment
          pip install pytest 
          
      - name: Run Automated Tests
        run: |
          # Use 'python -m pytest' to guarantee it calls the environment module directly
          python -m pytest test_app.py
  

    # 3. Build & Push Docker Image
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/temp-converter:${{ github.sha }}

    # 4. Deployment (Kubernetes)
    - name: Set up Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_DATA }}" | base64 --decode > ~/.kube/config

    - name: Update Manifest and Deploy
      run: |
        # Replace placeholders with real Docker Hub username and unique image tag
        sed -i "s|DOCKERHUB_USERNAME|${{ secrets.DOCKER_USERNAME }}|g" k8s/deployment.yaml
        sed -i "s|IMAGE_TAG|${{ github.sha }}|g" k8s/deployment.yaml
        
        # Apply to Kubernetes cluster
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
